const PAL=[[27,43,69,59,85,120],[40,33,64,110,74,110],[45,60,70,150,130,100]],SN=['馬路','變電所','工地'];
let drops=[],splats=[],skyB=[],floats=[],bT=6,stun=0,gapLeft=300,clu=0;
let cur=PAL[0].slice(),sc=0,bg=[],fl=[],flT=2,tag=0,bgGap=150;
let W,H,dpr,gy,px,best=0,obs=[],dist=0,v=0,oy=0,vy=0,state='idle',t=0,off=0,dead=null,last=performance.now(),cause=0;
try{best=+localStorage.getItem('runBest')||0}catch(e){}
$('hi').textContent='最高 '+best;
function layout(){dpr=window.devicePixelRatio||1;W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);gy=H*.7;px=W*.22}
addEventListener('resize',layout);layout();
function drawCry(c,x,y,R){
  c.save();c.beginPath();c.arc(x,y,R,0,6.28);c.clip();
  c.drawImage(face,x-R,y-R,R*2,R*2);
  const ex=[x-.68*R,x+.05*R],ey=[y-.29*R,y-.44*R];
  c.strokeStyle='rgba(90,190,255,.9)';c.fillStyle='rgba(90,190,255,.95)';c.lineCap='round';c.lineWidth=.2*R;
  for(let i=0;i<2;i++){c.beginPath();c.moveTo(ex[i],ey[i]+.1*R);c.lineTo(ex[i]-.04*R,y+.95*R);c.stroke();c.beginPath();c.arc(ex[i],ey[i]+.08*R,.13*R,0,6.28);c.fill()}
  c.fillStyle='#4a1f1f';c.beginPath();c.ellipse(x-.25*R,y-.02*R,.34*R,.18*R,0,0,6.28);c.fill();
  c.fillStyle='#e07a7a';c.beginPath();c.ellipse(x-.25*R,y+.06*R,.18*R,.07*R,0,0,6.28);c.fill();
  c.restore();
  c.strokeStyle='#f3efe6';c.lineWidth=2;c.beginPath();c.arc(x,y,R,0,6.28);c.stroke();
}
function jump(e){if(e)e.preventDefault();if(state==='run'&&oy<=0){vy=700}}
cv.addEventListener('touchstart',jump,{passive:false});
cv.addEventListener('mousedown',jump);
addEventListener('keydown',e=>{if(e.code==='Space')jump(e)});
function start(){obs=[];drops=[];splats=[];skyB=[];floats=[];bT=5;stun=0;inv=0;gapLeft=300;clu=0;dist=0;v=270;oy=0;vy=0;t=0;dead=null;state='run';$('msg').classList.add('hide');$('cry').classList.add('hide')}
$('b').onclick=start;
function die(o){
  state='dead';cause=o.k;dead={t:0};oy=0;vy=0;stun=0;
  if(Math.floor(dist)>best){best=Math.floor(dist);try{localStorage.setItem('runBest',best)}catch(e){}}
  $('hi').textContent='最高 '+best;
  setTimeout(()=>{
    $('t').textContent='青蛙被「'+HZ[cause].n+'」嚇哭了！';
    $('d').innerHTML='跑了 <b>'+Math.floor(dist)+'</b> 公尺　最高 <b>'+best+'</b> 公尺<br><span style="display:block;margin-top:14px;padding:12px 14px;border-radius:12px;background:rgba(255,182,39,.15);color:#ffb627">工安警語<br><span style="color:#f3efe6">'+HZ[cause].tip+'<br>'+SL[Math.floor(Math.random()*SL.length)]+'</span></span>';
    $('b').textContent='再跑一次';
    const cc=$('cry'),cx=cc.getContext('2d');cc.classList.remove('hide');cx.clearRect(0,0,240,240);drawCry(cx,120,120,110);
    $('msg').classList.remove('hide');
  },1900);
}
function loop(n){
  const dt=Math.min((n-last)/1000,.05);last=n;t+=dt;
  if(state==='run'){
    v=Math.min(480,270+t*6);if(stun>0)stun-=dt;if(inv>0)inv-=dt;dist+=v*dt/40;off=(off+v*dt)%80;
    vy-=1900*dt;oy+=vy*dt;if(oy<=0){oy=0;vy=0}
    gapLeft-=v*dt;
    if(gapLeft<=0){obs.push({x:W+60,k:Math.floor(Math.random()*HZ.length)});
      const r=Math.random();
      gapLeft=r<.3?v*.9+90+Math.random()*40:r<.75?v*(1.1+Math.random()*.5)+150:v*(1.6+Math.random())+230}
    for(const o of obs){
      o.x-=v*dt;const z=HZ[o.k];
      const ox0=o.x-z.s*z.w,ox1=o.x+z.s*z.w,oh=z.s*z.h-8;
      if(inv<=0&&px+11>ox0&&px-11<ox1&&oy<oh)die(o);
    }
    obs=obs.filter(o=>o.x>-80);
    bT-=dt;
    if(bT<=0){bT=9+Math.random()*6;const crow=Math.random()<.5,dir=Math.random()<.5?1:-1;skyB.push({crow,x:dir>0?-50:W+50,y:H*.12+Math.random()*gy*.2,vx:dir*(crow?200:240),t:0,done:Math.random()<.12})}
    for(const b of skyB){
      b.x+=b.vx*dt;b.t+=dt;
      if(!b.done&&Math.abs(b.x-px)<Math.abs(b.vx)*dt+2){b.done=true;drops.push({x:px,y:b.y+18,vy:0,egg:!b.crow})}
    }
    skyB=skyB.filter(b=>b.x>-90&&b.x<W+90);
    for(const d of drops){
      d.vy+=900*dt;d.y+=d.vy*dt;
      if(stun<=0&&Math.abs(d.x-px)<24&&d.y>gy-oy-84&&d.y<gy-oy+4){stun=1.4;inv=2;messEgg=d.egg;if(oy<=0)vy=520;dist=Math.max(0,dist-3);floats.push({x:px,y:gy-130,l:1.2,txt:'-3 公尺'});splats.push({x:d.x,y:d.y,egg:d.egg,l:.9});d.dead=true}
      else if(d.y>=gy-6){splats.push({x:d.x,y:gy-4,egg:d.egg,l:.9});d.dead=true}
    }
    drops=drops.filter(d=>!d.dead);
    splats.forEach(q=>{q.l-=dt;q.x-=v*dt});splats=splats.filter(q=>q.l>0);
    floats.forEach(f=>{f.l-=dt;f.y-=30*dt});floats=floats.filter(f=>f.l>0);
    $('ds').textContent='距離 '+Math.floor(dist)+' 公尺';
  }else if(state==='dead'){dead.t+=dt;off=(off+0)%80}
  else if(state==='idle'){off=(off+60*dt)%80}
  const sv=state==='run'?v:state==='idle'?60:0,scn=Math.floor(dist/150)%3;
  if(state==='run'&&scn!==sc){sc=scn;tag=2.2}
  tag=Math.max(0,tag-dt);
  for(let i=0;i<6;i++)cur[i]+=(PAL[sc][i]-cur[i])*Math.min(1,dt*1.2);
  bg.forEach(b=>b.x-=sv*.35*dt);bg=bg.filter(b=>b.x>-200);
  const lb=bg.length?bg[bg.length-1].x:-1e9;
  if(lb<W-bgGap){bg.push({x:W+120,t:Math.floor(Math.random()*2),sc});bgGap=100+Math.random()*180}
  flT-=dt;
  if(flT<=0&&fl.length<2){flT=2.5+Math.random()*3;const dir=Math.random()<.5?1:-1,an=Math.random()<.4;
    let img,cat=0;if(an){const q=ANI[pick('a',ANI.length)];img=q.img;cat=q.cat}else img=PPL[pick('p',PPL.length)];
    fl.push({img,cat,msg:cat?CS[Math.floor(Math.random()*CS.length)]:null,x:dir>0?-70:W+70,y:gy*.32+Math.random()*gy*.22,vx:dir*(cat?60:70+Math.random()*40),s:100,t:0,ph:Math.random()*6})}
  fl.forEach(o=>{o.x+=o.vx*dt;o.t+=dt});fl=fl.filter(o=>o.x>-130&&o.x<W+130);
  draw();requestAnimationFrame(loop);
}
function fillBg(){bg=[];for(let x=60;x<W+120;x+=100+Math.random()*180)bg.push({x,t:Math.floor(Math.random()*2),sc})}
function drawBg(b){
  ctx.fillStyle='rgba(10,20,35,.55)';ctx.strokeStyle='rgba(10,20,35,.55)';ctx.lineWidth=3;const x=b.x;
  if(b.sc===0){
    if(b.t===0){ctx.fillRect(x-5,gy-60,10,60);ctx.beginPath();ctx.arc(x,gy-82,34,0,6.28);ctx.fill()}
    else{ctx.fillRect(x-30,gy-90,60,90);ctx.fillStyle='rgba(255,220,120,.35)';for(let i=0;i<3;i++)for(let j=0;j<3;j++)ctx.fillRect(x-22+i*16,gy-80+j*24,9,12)}
  }else if(b.sc===1){
    if(b.t===0){ctx.beginPath();ctx.moveTo(x-28,gy);ctx.lineTo(x,gy-150);ctx.lineTo(x+28,gy);ctx.moveTo(x-40,gy-120);ctx.lineTo(x+40,gy-120);ctx.moveTo(x-30,gy-88);ctx.lineTo(x+30,gy-88);ctx.moveTo(x-20,gy-60);ctx.lineTo(x+14,gy-100);ctx.stroke()}
    else{ctx.fillRect(x-34,gy-50,68,50);for(let i=-1;i<2;i++)ctx.fillRect(x+i*22-3,gy-70,6,20);ctx.fillRect(x-50,gy-24,100,3)}
  }else{
    if(b.t===0){ctx.fillRect(x-5,gy-190,10,190);ctx.fillRect(x-90,gy-190,150,8);ctx.fillRect(x-80,gy-182,3,40);ctx.fillRect(x+50,gy-182,6,30)}
    else{ctx.strokeRect(x-34,gy-110,68,110);ctx.beginPath();ctx.moveTo(x-34,gy-55);ctx.lineTo(x+34,gy-55);ctx.moveTo(x,gy-110);ctx.lineTo(x,gy);ctx.stroke()}
  }
}
const bags={};
function pick(k,n){
  let b=bags[k];
  if(!b||!b.length){b=[];for(let i=0;i<n;i++)b.push(i);for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}if(n>1&&b[b.length-1]===bags['l'+k])b.unshift(b.pop());bags[k]=b}
  const v=b.pop();bags['l'+k]=v;return v;
}
function drawFly(o){
  const y=o.y+Math.sin(o.t*3+o.ph)*8,r=o.s/2,w=Math.sin(o.t*9)*.5+.5;
  ctx.save();ctx.translate(o.x,y);ctx.rotate(Math.sin(o.t*2+o.ph)*.1);
  ctx.fillStyle='rgba(255,255,255,.85)';
  ctx.beginPath();ctx.ellipse(-r-6,-8+w*10,16,7,-.5-w*.3,0,6.28);ctx.ellipse(r+6,-8+w*10,16,7,.5+w*.3,0,6.28);ctx.fill();
  ctx.shadowColor='rgba(0,0,0,.45)';ctx.shadowBlur=12;ctx.drawImage(o.img,-r,-r,o.s,o.s);ctx.shadowBlur=0;
  ctx.strokeStyle='#f3efe6';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,r,0,6.28);ctx.stroke();
  if(o.img===mgr){ctx.font='bold 15px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';const tw=ctx.measureText('經理').width+16;ctx.fillStyle='#ffb627';ctx.beginPath();ctx.roundRect(-tw/2,r+6,tw,24,8);ctx.fill();ctx.fillStyle='#14233a';ctx.fillText('經理',0,r+18)}
  ctx.restore();
}
function draw(){
  ctx.clearRect(0,0,W,H);
  const g=ctx.createLinearGradient(0,0,0,gy);g.addColorStop(0,'rgb('+cur.slice(0,3).map(Math.round)+')');g.addColorStop(1,'rgb('+cur.slice(3).map(Math.round)+')');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,gy);
  bg.forEach(drawBg);fl.forEach(drawFly);
  ctx.fillStyle='#4a5568';ctx.fillRect(0,gy,W,H-gy);
  ctx.fillStyle='#2f3846';ctx.fillRect(0,gy,W,6);
  ctx.fillStyle='#f2b21c';
  for(let x=-off;x<W;x+=80)ctx.fillRect(x,gy+(H-gy)*.45,44,8);
  // obstacles
  ctx.textAlign='center';
  for(const o of obs){
    const z=HZ[o.k];
    ctx.font=z.s+'px serif';ctx.textBaseline='bottom';ctx.fillText(z.e,o.x,gy+6);
    ctx.font='bold 13px sans-serif';ctx.textBaseline='middle';
    const ty=gy-z.s*z.h-16,tw=ctx.measureText(z.n).width+12;
    ctx.fillStyle='#ffb627';ctx.fillRect(o.x-tw/2,ty-10,tw,20);
    ctx.fillStyle='#14233a';ctx.fillText(z.n,o.x,ty);
  }
  if(tag>0){ctx.globalAlpha=Math.min(1,tag);ctx.fillStyle='#f3efe6';ctx.font='bold 20px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('路段：'+SN[sc],W/2,64);ctx.globalAlpha=1}
  const cf=fl.find(o=>o.cat&&o.x>-40&&o.x<W+40);
  if(cf){
    const bw=Math.min(W-24,320),bx=W/2-bw/2,by=86;
    ctx.fillStyle='#ffb627';ctx.beginPath();ctx.roundRect(bx,by,bw,92,12);ctx.fill();
    ctx.fillStyle='#14233a';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.font='bold 18px sans-serif';ctx.fillText('🐱 '+cf.msg[0],W/2,by+20);
    ctx.font='bold 15px sans-serif';ctx.fillText(cf.msg[1],W/2,by+48);ctx.fillText(cf.msg[2],W/2,by+70);
  }
  for(const q of skyB)drawBird(q);
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='28px serif';
  for(const d of drops)ctx.fillText(d.egg?'🥚':'💩',d.x,d.y);
  for(const q of splats){ctx.globalAlpha=Math.min(1,q.l*1.5);ctx.fillStyle=q.egg?'#fff6d6':'#6b4423';ctx.beginPath();ctx.ellipse(q.x,q.y,18,6,0,0,6.28);ctx.fill();if(q.egg){ctx.fillStyle='#ffb627';ctx.beginPath();ctx.ellipse(q.x,q.y,7,3,0,0,6.28);ctx.fill()}ctx.globalAlpha=1}
  // runner
  const feet=gy-oy,R=26,sw=state==='run'&&oy<=0?Math.sin(t*16)*8:0,hurt=state==='run'&&stun>0;
  if(state==='dead'){
    ctx.save();ctx.translate(px,gy);ctx.rotate(-1.45*Math.min(1,dead.t/.3));
    ctx.fillStyle='#1f3a5f';ctx.fillRect(-11,-50,22,30);ctx.fillStyle='#4fd1c5';ctx.fillRect(-11,-50,22,6);
    ctx.fillStyle='#14233a';ctx.fillRect(-10,-22,8,22);ctx.fillRect(2,-22,8,22);
    ctx.restore();
    const k=Math.min(1,dead.t/.35),hx=px+dead.t*430,hb=Math.abs(Math.sin(dead.t*9))*Math.max(0,60*Math.exp(-dead.t*1.2));
    const hy2=gy-R-(1-k)*44-Math.sin(k*Math.PI)*40-hb;
    ctx.save();ctx.translate(hx,hy2);ctx.rotate((hx-px)/R);drawCry(ctx,0,0,R);ctx.restore();
  }else{
    ctx.globalAlpha=inv>0&&Math.floor(t*12)%2?.5:1;
    ctx.fillStyle='#1f3a5f';ctx.fillRect(px-11,feet-50,22,30);
    ctx.fillStyle='#4fd1c5';ctx.fillRect(px-11,feet-50,22,6);
    ctx.fillStyle='#14233a';ctx.fillRect(px-10+sw,feet-22,8,22);ctx.fillRect(px+2-sw,feet-22,8,22);
    const hy=feet-50-R+6;
    if(hurt){drawCry(ctx,px,hy,R);drawMess(px,hy,R,messEgg)}
    else{ctx.drawImage(face,px-R,hy-R,R*2,R*2);ctx.strokeStyle='#f3efe6';ctx.lineWidth=2;ctx.beginPath();ctx.arc(px,hy,R,0,6.28);ctx.stroke()}
  }
  ctx.globalAlpha=1;
  for(const f of floats){ctx.globalAlpha=Math.min(1,f.l);ctx.fillStyle='#ff8a80';ctx.font='bold 18px sans-serif';ctx.textAlign='center';ctx.fillText(f.txt,f.x,f.y);ctx.globalAlpha=1}
}
let messEgg=false,inv=0;
function drawMess(x,y,R,egg){
  ctx.save();ctx.beginPath();ctx.arc(x,y,R,0,6.28);ctx.clip();ctx.globalAlpha=Math.min(1,stun/.6);
  ctx.fillStyle=egg?'rgba(255,246,214,.95)':'rgba(107,68,35,.95)';
  ctx.beginPath();ctx.ellipse(x-.2*R,y-.62*R,.62*R,.28*R,0,0,6.28);ctx.fill();
  ctx.beginPath();ctx.ellipse(x-.62*R,y-.3*R,.14*R,.4*R,0,0,6.28);ctx.fill();
  ctx.beginPath();ctx.ellipse(x+.5*R,y-.3*R,.12*R,.32*R,0,0,6.28);ctx.fill();
  ctx.fillStyle=egg?'#ffb627':'rgba(60,35,15,.9)';
  if(egg){ctx.beginPath();ctx.arc(x-.2*R,y-.62*R,.26*R,0,6.28);ctx.fill()}
  else{for(let i=0;i<4;i++){ctx.beginPath();ctx.arc(x-.6*R+i*.35*R,y-.62*R+(i%2)*.1*R,.08*R,0,6.28);ctx.fill()}}
  ctx.restore();
}
function drawBird(b){
  const S=b.crow?30:22,f=Math.sin(b.t*14),dir=b.vx>0?1:-1,body=b.crow?'#15181f':'#c08a4c';
  ctx.save();ctx.translate(b.x,b.y+Math.sin(b.t*5)*4);ctx.scale(dir,1);
  ctx.fillStyle=body;ctx.beginPath();ctx.ellipse(0,0,S,S*.55,0,0,6.28);ctx.fill();
  ctx.beginPath();ctx.moveTo(-S*.8,0);ctx.lineTo(-S*1.5,-S*.35);ctx.lineTo(-S*1.4,S*.25);ctx.fill();
  ctx.beginPath();ctx.arc(S*.85,-S*.3,S*.38,0,6.28);ctx.fill();
  ctx.fillStyle=b.crow?'#2e3441':'#9a6b34';ctx.beginPath();ctx.ellipse(-S*.1,-S*.1,S*.7,S*.28+Math.abs(f)*S*.55,-.4*f-.3,0,6.28);ctx.fill();
  ctx.fillStyle='#ffb627';ctx.beginPath();ctx.moveTo(S*1.18,-S*.36);ctx.lineTo(S*1.7,-S*.22);ctx.lineTo(S*1.18,-S*.1);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(S*.95,-S*.4,S*.1,0,6.28);ctx.fill();
  ctx.fillStyle='#000';ctx.beginPath();ctx.arc(S*.98,-S*.4,S*.05,0,6.28);ctx.fill();
  ctx.restore();
}
fillBg();requestAnimationFrame(loop);
